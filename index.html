<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ornithographies</title>
  <style>
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-ExtraLight.otf'); font-weight: 200; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-ExtraLightItalic.otf'); font-weight: 200; font-style: italic; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-Light.otf'); font-weight: 300; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-LightItalic.otf'); font-weight: 300; font-style: italic; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-Regular.otf'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-RegularItalic.otf'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-Medium.otf'); font-weight: 500; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-MediumItalic.otf'); font-weight: 500; font-style: italic; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-DemiBold.otf'); font-weight: 600; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-DemiBoldItalic.otf'); font-weight: 600; font-style: italic; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-Bold.otf'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-BoldItalic.otf'); font-weight: 700; font-style: italic; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-ExtraBold.otf'); font-weight: 800; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-ExtraBoldItalic.otf'); font-weight: 800; font-style: italic; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-Black.otf'); font-weight: 900; font-style: normal; }
    @font-face { font-family: 'Gravitica'; src: url('fonts/Gravitica-BlackItalic.otf'); font-weight: 900; font-style: italic; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #fff;
      color: #111;
      font-family: 'Gravitica', Arial, Helvetica, sans-serif;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      margin-right: 24px;
    }

    .bird-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .bird-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
      cursor: pointer;
      border-bottom: 1px solid #e8e8e8;
      gap: 8px;
      user-select: none;
    }

    .bird-item img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }

    .bird-item span {
      font-size: 14px;
      text-align: center;
      line-height: 1.3;
      color: #888;
    }

    .bird-item.active span {
      color: #111;
    }

    .bird-item.unavailable {
      opacity: 0.4;
      cursor: default;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .main-header {
      padding-top: 22px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-right: 24px;
    }

    .main-header h1 {
      font-size: 48px;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .main-header p {
      font-size: 28px;
    }

    #playBtn {
      display: none;
      background: none;
      border: none;
      padding: 0;
      width: 1em;
      height: 1em;
      font-size: 28px;
      cursor: pointer;
      color: #111;
      line-height: 1;
      text-align: center;
      align-items: center;
      justify-content: center;
    }

    /* ── Timeline ── */
    .timeline-wrapper {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
      min-height: 0;
    }

    .timeline {
      position: relative;
      height: 100%;
    }

    .guide {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: #d4d4cc;
      pointer-events: none;
    }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0, 0, 0, 0.18);
      pointer-events: none;
      z-index: 10;
      transition: left 0.05s linear;
    }

    .note {
      position: absolute;
      padding: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      opacity: 0;
      cursor: pointer;
      pointer-events: none;
      transition: opacity 0.08s linear, transform 0.08s linear, filter 0.08s linear;
    }

    .note.played {
      opacity: 0.85;
      pointer-events: auto;
    }

    .note.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.22);
      z-index: 2;
    }

    .note img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* ── Footer ── */
    .main-footer {
      font-size: 16px;
      flex-shrink: 0;
      line-height: 1.5;
    }


    .subtitle-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
  </style>
</head>
<body>

  <nav class="sidebar">
    <ul class="bird-list" id="birdList"></ul>
  </nav>

  <div class="main">
    <div class="main-header">
      <h1>Ornithographies</h1>
      <div class="subtitle-wrapper">
          <p id="subtitle">Sélectionne un oiseau pour découvrir son chant</p>
          <button id="playBtn" type="button">▶</button>
      </div>
      
    </div>

    <div class="timeline-wrapper" id="timelineWrapper">
      <div class="timeline" id="timeline"></div>
    </div>

    <footer class="main-footer">
      Ornithographies est un langage graphique et ornithologique déployé à partir d'ateliers
      d'écoute et de dessins avec la classe de CE2 de l'école primaire de
      Courcelles-lès-Montbéliard en février 2026.
    </footer>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script>
    /* ── Config keys that belong to rendering (not bird identity) ── */
    const CFG_KEYS = new Set([
      'px_per_second', 'note_scale', 'active_scale',
      'highlight_color', 'vertical_padding', 'pitch_step_px', 'line_spacing'
    ]);

    function pseudoRandom(seed) {
      const x = Math.sin(seed * 999.91) * 10000;
      return x - Math.floor(x);
    }

    /* ── DOM refs ── */
    const audio = document.getElementById('audio');
    const timelineEl = document.getElementById('timeline');
    const wrapperEl = document.getElementById('timelineWrapper');
    const birdListEl = document.getElementById('birdList');
    const subtitleEl = document.getElementById('subtitle');
    const playBtn = document.getElementById('playBtn');

    /* ── State ── */
    let DEFAULT_CFG = {};
    let currentBird = null;
    let noteElements = [];
    let rafId = null;
    let activeCfg = {};

    /* ── Load config and build sidebar ── */
    async function init() {
      const config = await fetch('display_config.json').then(r => r.json());
      DEFAULT_CFG = config.default || {};

      const birds = (config.birds || []).map(b => {
        const cfg = {};
        for (const [k, v] of Object.entries(b)) {
          if (CFG_KEYS.has(k)) cfg[k] = v;
        }
        const keyCount = b.keys || 0;
        return {
          id: b.id,
          name: b.name,
          drawing: b.drawing,
          sound: b.sound || null,
          dataUrl: b.dataUrl || null,
          keys: Array.from({ length: keyCount }, (_, i) => `img/${b.id}/key-${i + 1}.svg`),
          cfg
        };
      });

      birds.forEach(bird => {
        const li = document.createElement('li');
        li.className = 'bird-item' + (bird.sound ? '' : ' unavailable');
        li.dataset.id = bird.id;
        li.innerHTML = `<img src="${bird.drawing}" alt="${bird.name}"><span>${bird.name}</span>`;
        if (bird.sound) li.addEventListener('click', () => handleBirdClick(bird));
        birdListEl.appendChild(li);
      });
    }

    init();

    /* ── Bird selection ── */
    async function handleBirdClick(bird) {
      if (currentBird === bird) {
        audio.paused ? audio.play() : audio.pause();
        return;
      }

      currentBird = bird;

      document.querySelectorAll('.bird-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === bird.id);
      });

      audio.pause();
      audio.src = bird.sound;

      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      noteElements = [];
      timelineEl.innerHTML = '';

      subtitleEl.textContent = bird.name;
      playBtn.style.display = 'inline-flex';
      playBtn.textContent = '▶';

      let data = null;
      if (bird.dataUrl) {
        try {
          const res = await fetch(bird.dataUrl);
          data = await res.json();
        } catch (e) {
          console.warn('Impossible de charger les notes :', e);
        }
      }

      await renderTimeline(bird, data);
      audio.play().catch(() => {});
    }

    /* ── Preload native SVG dimensions ── */
    function loadImgSize(url) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve([img.naturalWidth, img.naturalHeight]);
        img.onerror = () => resolve([100, 100]);
        img.src = url;
      });
    }

    /* ── Timeline rendering ── */
    async function renderTimeline(bird, data) {
      activeCfg = { ...DEFAULT_CFG, ...bird.cfg };

      const notes = data ? data.notes : [];
      const duration = data ? data.duration : (audio.duration || 60);

      const wrapperH = wrapperEl.clientHeight || 360;
      const wrapperW = wrapperEl.clientWidth || 900;

      const pxPerSec = activeCfg.px_per_second;
      const lineSpacing = activeCfg.line_spacing;
      const scale = activeCfg.note_scale ?? 0.32;
      const activeScale = activeCfg.active_scale;
      const pitchStepPx = activeCfg.pitch_step_px;
      const vertPad = activeCfg.vertical_padding;
      const keys = bird.keys;

      const trackW = Math.max(wrapperW, duration * pxPerSec + 80);
      timelineEl.style.width = trackW + 'px';
      timelineEl.style.height = wrapperH + 'px';

      /* Staff lines centered vertically */
      const staffCenterY = wrapperH / 2;
      const staffTop = staffCenterY - 2 * lineSpacing;

      for (let i = 0; i < 5; i++) {
        const line = document.createElement('div');
        line.className = 'guide';
        line.style.top = (staffTop + i * lineSpacing) + 'px';
        timelineEl.appendChild(line);
      }

      /* Playhead */
      const playhead = document.createElement('div');
      playhead.className = 'playhead';
      playhead.id = 'playhead';
      timelineEl.appendChild(playhead);

      if (notes.length === 0) return;

      /* Preload native dimensions for each unique key */
      const keyDims = keys.length > 0
        ? await Promise.all(keys.map(url => loadImgSize(url)))
        : [];

      /* Pitch mapping — use max note height across keys for padding */
      const maxNoteH = keyDims.length
        ? Math.max(...keyDims.map(([, h]) => Math.round(h * scale)))
        : 80;

      const midiValues = notes.map(n => n.midi);
      const midiCenter = (Math.min(...midiValues) + Math.max(...midiValues)) / 2;
      const midiRange = Math.max(1, Math.max(...midiValues) - Math.min(...midiValues));

      const noteHalf = (maxNoteH * activeScale) / 2;
      const minY = vertPad + noteHalf;
      const maxY = wrapperH - vertPad - noteHalf;
      const pitchStep = Math.min(pitchStepPx, Math.max(1, maxY - minY) / midiRange);

      noteElements = notes.map(item => {
        const keyIdx = (item.key != null)
          ? Math.max(0, Math.min(keys.length - 1, item.key - 1))
          : Math.floor(pseudoRandom(item.start + item.midi + item.duration) * Math.max(keys.length, 1));
        const [kw, kh] = keyDims[keyIdx] ?? [100, 100];
        const noteH = Math.round(kh * scale);
        const noteW = Math.max(Math.round(kw * scale), item.duration * pxPerSec);

        const x = item.start * pxPerSec + 40;
        const rawY = staffCenterY - (item.midi - midiCenter) * pitchStep;
        const y = Math.min(maxY, Math.max(minY, rawY));

        const note = document.createElement('button');
        note.type = 'button';
        note.className = 'note';
        note.style.left = x + 'px';
        note.style.top = y + 'px';
        note.style.width = noteW + 'px';
        note.style.height = noteH + 'px';
        note.title = `${item.note} — ${item.start.toFixed(2)}s`;

        note.addEventListener('click', () => {
          audio.currentTime = item.start;
          if (audio.paused) audio.play();
        });

        if (keys.length > 0) {
          const img = document.createElement('img');
          img.alt = item.note || '';
          img.src = keys[keyIdx];
          note.appendChild(img);
        }

        timelineEl.appendChild(note);
        return { item, note };
      });

      startTick();
    }

    /* ── Animation loop ── */
    function startTick() {
      if (rafId) cancelAnimationFrame(rafId);

      const playhead = document.getElementById('playhead');
      const pxPerSec = activeCfg.px_per_second;

      function tick() {
        const t = audio.currentTime || 0;
        const x = t * pxPerSec + 40;

        if (playhead) playhead.style.left = x + 'px';

        /* Auto-scroll: keep playhead at ~30% from left */
        if (!audio.paused) {
          const target = x - wrapperEl.clientWidth * 0.3;
          wrapperEl.scrollLeft = Math.max(0, target);
        }

        for (const { item, note } of noteElements) {
          const played = t >= item.start;
          const active = t >= item.start && t <= item.end;
          note.classList.toggle('played', played);
          note.classList.toggle('active', active);
        }

        rafId = requestAnimationFrame(tick);
      }

      rafId = requestAnimationFrame(tick);
    }

    playBtn.addEventListener('click', () => {
      if (!currentBird) return;
      audio.paused ? audio.play() : audio.pause();
    });

    audio.addEventListener('play',  () => { playBtn.textContent = '■'; });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });

    /* ── Reset playhead to start when audio ends ── */
    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
      wrapperEl.scrollLeft = 0;
    });
  </script>
</body>
</html>
